<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff7dc"><title>Shadow Match · Dream Brainmatch</title>
  <meta name="description" content="Match objects and hand poses with their silhouettes. A visual memory game for children.">
  <base href="../shape-friends/">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="studio.css?v=4"><link rel="stylesheet" href="prototype.css?v=14">
  <link rel="stylesheet" href="../shadow-match/shadow-match.css?v=1">
</head><body>
  <p class="variant-loading" role="status">Getting your shadow matches ready…</p>
  <script type="module">
    try {
      const manifestURL=new URL('game-content.json',location.href).href;
      const response=await fetch('../shape-friends/index.html');
      if(!response.ok)throw Error('Template unavailable');
      const template=new DOMParser().parseFromString(await response.text(),'text/html');
      template.body.querySelectorAll('script').forEach(script=>script.remove());
      document.body.replaceChildren(...template.body.childNodes);
      document.documentElement.dataset.contentManifest=manifestURL;
      await import(new URL('../shape-friends/app.js?v=19',location.href).href);
    } catch(error) {
      document.body.textContent='Shadow Match could not start. Please reload the page.';
    }
  </script>
</body></html>
